<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Una cola circular y espaciada para organizar tus materias."
    />
    <title>Cola de estudio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="storage-blocked">
    <main class="app-shell">
      <div class="planner-status">
        <button id="settingsButton" class="settings-button" type="button">Ajustes</button>
        <output id="modeBadge" class="mode-badge">Regular</output>
      </div>
      <section class="queue-section" aria-label="Cola circular de materias">
        <div
          class="queue"
          id="queue"
          aria-live="polite"
          aria-label="Cola circular de materias"
        ></div>
      </section>
    </main>

    <aside class="subject-dock" id="subjectDock" aria-label="Materias existentes">
      <div class="subject-dock-list" id="subjectDockList"></div>
    </aside>

    <dialog class="storage-panel" id="storageDialog" aria-labelledby="storageMessage">
      <div class="storage-content">
        <p id="storageMessage">Preparando la carpeta…</p>
        <p class="storage-error" id="storageError" role="alert"></p>
        <div class="storage-actions">
          <button class="storage-primary" id="storagePrimaryButton" type="button">
            Elegir carpeta
          </button>
          <button class="storage-secondary" id="storageSecondaryButton" type="button" hidden>
            Elegir otra carpeta
          </button>
        </div>
      </div>
    </dialog>

    <dialog class="quick-add" id="addDialog" aria-labelledby="addPrompt">
      <form id="addForm" method="dialog" novalidate>
        <label class="sr-only" id="addPrompt" for="newSubjectName">
          Nombre de la materia
        </label>
        <input
          id="newSubjectName"
          name="name"
          type="text"
          maxlength="60"
          aria-label="Nombre de la materia"
          autocomplete="off"
          required
        />
        <p class="field-error add-error" id="addError" role="alert"></p>
      </form>
    </dialog>

    <dialog class="detail-panel" id="detailDialog" aria-label="Detalle de materia">
      <form id="detailForm" method="dialog" novalidate>
        <input id="detailId" name="id" type="hidden" />

        <label class="field name-field">
          <span>Nombre</span>
          <input id="detailName" name="name" type="text" maxlength="60" required />
        </label>

        <div class="planner-fields">
          <label class="field"><span>Peso base</span><input id="detailBaseWeight" type="number" min="1" max="100" required /></label>
          <label class="check-field"><input id="detailActive" type="checkbox" /> Activa</label>
        </div>

        <fieldset class="class-days"><legend>D&iacute;as de cursado</legend>
          <label><input type="checkbox" name="classDays" value="1" /> Lu</label>
          <label><input type="checkbox" name="classDays" value="2" /> Ma</label>
          <label><input type="checkbox" name="classDays" value="3" /> Mi</label>
          <label><input type="checkbox" name="classDays" value="4" /> Ju</label>
          <label><input type="checkbox" name="classDays" value="5" /> Vi</label>
          <label><input type="checkbox" name="classDays" value="6" /> S&aacute;</label>
          <label><input type="checkbox" name="classDays" value="0" /> Do</label>
        </fieldset>

        <section class="evaluations-section" aria-labelledby="evaluationsTitle">
          <div class="section-heading"><span id="evaluationsTitle">Evaluaciones</span><button id="addEvaluationButton" type="button">+ Agregar</button></div>
          <div id="evaluationList" class="evaluation-list"></div>
        </section>

        <div class="detail-summary">
          <div class="field color-field">
            <span id="detailColorLabel">Color</span>
            <input id="detailColor" name="color" type="hidden" />
            <button
              id="colorButton"
              class="color-button"
              type="button"
              aria-labelledby="detailColorLabel colorButtonLabel"
              aria-haspopup="dialog"
              aria-expanded="false"
            >
              <span class="sr-only" id="colorButtonLabel">Cambiar de color</span>
            </button>

            <div
              class="color-picker"
              id="colorPicker"
              role="dialog"
              aria-labelledby="colorPickerTitle"
              hidden
            >
              <p class="color-picker-title" id="colorPickerTitle">Cambiar de color</p>
              <label class="color-slider">
                <span>Tono</span>
                <input id="colorHue" type="range" min="0" max="360" step="1" />
              </label>
              <label class="color-slider">
                <span>Saturaci&oacute;n</span>
                <input id="colorSaturation" type="range" min="0" max="100" step="1" />
              </label>
              <label class="color-slider">
                <span>Luz</span>
                <input id="colorLightness" type="range" min="0" max="100" step="1" />
              </label>
              <label class="color-hex-field">
                <span>Hex o RGB</span>
                <input
                  id="colorHex"
                  type="text"
                  maxlength="18"
                  placeholder="#FDC745 o 253, 199, 69"
                  spellcheck="false"
                  aria-describedby="colorInputError"
                />
              </label>
              <p class="color-input-error" id="colorInputError" role="alert"></p>
            </div>
          </div>

          <div class="queue-metric">
            <span id="appearancesLabel">Apariciones por vuelta</span>
            <output id="detailAppearances" aria-labelledby="appearancesLabel"></output>
          </div>

          <div class="queue-metric">
            <span id="nextTurnLabel">Vuelve en</span>
            <output id="detailNextTurn" aria-labelledby="nextTurnLabel"></output>
          </div>
        </div>

        <div class="schedule-explanation">
          <output id="detailMode"></output>
          <output id="detailWeight"></output>
          <output id="detailReason"></output>
        </div>

        <p class="field-error" id="detailError" role="alert"></p>

        <button class="delete-button" id="deleteButton" type="button">
          Eliminar
        </button>
      </form>
    </dialog>

    <dialog class="settings-panel" id="settingsDialog" aria-labelledby="settingsTitle">
      <form id="settingsForm" method="dialog" novalidate>
        <h2 id="settingsTitle">Ajustes del planificador</h2>
        <label class="field"><span>Turnos por ciclo</span><input id="cycleSize" type="number" min="1" max="100" required /></label>
        <label class="field"><span>Agresividad (K)</span><input id="urgencyK" type="number" min="0" max="100" step="0.1" required /></label>
        <p class="field-error" id="settingsError" role="alert"></p>
        <div class="settings-actions"><button type="submit">Guardar</button><button id="cancelSettings" type="button">Cancelar</button></div>
      </form>
    </dialog>

    <script src="scheduler.js"></script>
    <script src="folder-storage.js"></script>
    <script src="app.js"></script>
  </body>
</html>
